<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | OWASP Project Handbook</title>
  <meta name="description" content="OWASP Project Handbook: {{ page.title }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --brand: #233e81;
      --accent: #53aae5;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1b2333;
      --muted: #5b6577;
      --border: #e1e6f0;
      --link: #233e81;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #4a6fd1;
        --bg: #0e1424;
        --card: #161e33;
        --text: #e8ecf5;
        --muted: #a3adc2;
        --border: #263150;
        --link: #8fb3ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    a { color: var(--link); }
    header {
      background: var(--brand);
      color: #fff;
      padding: 18px 16px;
    }
    header .inner, .wrap { max-width: 1080px; margin: 0 auto; }
    header a { color: #fff; text-decoration: none; }
    header .eyebrow { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; }
    header .name { font-size: 1.35rem; font-weight: 700; }
    .wrap {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      padding: 32px 16px 48px;
    }
    nav ul { list-style: none; margin: 0; padding: 0; }
    nav li { margin: 0 0 4px; }
    nav a {
      display: block;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
    }
    nav a:hover { background: var(--card); }
    nav a.active { background: var(--card); border-left: 3px solid var(--brand); font-weight: 600; }
    nav .back { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
    main {
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 36px;
    }
    main h1 { margin-top: 0; font-size: 1.9rem; line-height: 1.25; }
    main h2, main h3 { margin-top: 1.8em; }
    main hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
    main code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
    .alert {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #fff4d6;
      color: #7a5300;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .fa-stack { font-size: 1.4em; vertical-align: middle; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 16px 32px; }
    @media (max-width: 760px) {
      .wrap { grid-template-columns: 1fr; gap: 16px; }
      main { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a href="{{ site.baseurl }}/handbook/">
        <div class="eyebrow">OWASP Foundation</div>
        <div class="name">Project Handbook</div>
      </a>
    </div>
  </header>
  <div class="wrap">
    <nav aria-label="Project Handbook">
      {% assign docs = site.pages | where: "document", "Project Handbook" | sort: "order" %}
      <ul>
        {% for p in docs %}
        <li><a href="{{ site.baseurl }}{{ p.url | replace: '.html', '' }}"{% if p.url == page.url %} class="active" aria-current="page"{% endif %}>{{ p.title }}</a></li>
        {% endfor %}
      </ul>
      <div class="back"><a href="https://owasp.org/groups/project-committee">&larr; Project Committee</a></div>
    </nav>
    <main>
      <h1>{{ page.title }}</h1>
      {{ content }}
    </main>
  </div>
  <footer>
    Maintained by the <a href="https://owasp.org/groups/project-committee">OWASP Project Committee</a> &middot;
    <a href="https://github.com/OWASP/www-committee-project/tree/master/handbook">Edit on GitHub</a>
  </footer>
</body>
</html>
